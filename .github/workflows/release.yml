name: Release

# Publishes to npm and then to the official MCP Registry when a version tag such
# as v1.0.0 is pushed. No secrets: npm uses Trusted Publishing (GitHub OIDC),
# which also attaches provenance automatically, and the MCP Registry uses
# GitHub OIDC too. Configure the trusted publisher on npmjs.com:
#   package opensdr-mcp → Settings → Trusted Publisher → GitHub Actions
#   owner: arif-js · repository: opensdr-mcp · workflow: release.yml
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .mcpb bundle to the GitHub Release
      id-token: write # npm Trusted Publishing + MCP Registry GitHub OIDC login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1 && npm --version

      - name: Check tag matches package.json and server.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRV_PKG=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG package=$PKG server=$SRV server.package=$SRV_PKG"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ] || [ "$TAG" != "$SRV_PKG" ]; then
            echo "::error::Tag v$TAG must match package.json and server.json versions."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pack

      # Skips when this exact version is already on npm (for example, the very
      # first release published by hand before the trusted publisher existed).
      - name: Publish to npm (Trusted Publishing)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping npm publish."
          else
            npm publish --access public
          fi

      - name: Install mcp-publisher (pinned)
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Build the MCPB bundle
        run: npm run build:mcpb

      - name: Attach the bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's section of CHANGELOG.md.
          node -e '
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const text = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const start = text.indexOf(`## [${v}]`);
            const body = start < 0 ? "" : text.slice(text.indexOf("\n", start) + 1).split(/\n## \[|\n\[Unreleased\]:/)[0];
            const install = "**Install:** `npx -y opensdr-mcp` · one-click for Claude Desktop: download `opensdr-mcp.mcpb` below.\n\n";
            require("fs").writeFileSync("release-notes.md", install + (body.trim() || "See CHANGELOG.md."));
          '
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "OpenSDR $GITHUB_REF_NAME" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" opensdr-mcp.mcpb --clobber
